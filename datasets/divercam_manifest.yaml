# DiverCam dives with Metashape pseudo-GT.
#
# Adding a newly-processed dive is one entry here plus a run of
# scripts/prepare_divercam_index.py against its export.
#
#   label    unique per dive. This is what reaches the loss as `dataset_names`,
#            so metric-scale supervision is gated per dive: only labels listed in
#            __METRIC_DATASETS__ contribute the metric term.
#   root     the dive's `down/` directory
#   export   export subdir holding sparse/0 and index/
#   depth    subdir of per-view dense depth EXRs, plus depth_meta.json. Values are
#            RAW chunk-internal depth at half the image resolution: multiply by
#            the sidecar's transform_scale for metres, halve the intrinsics, and
#            treat 0 as invalid. Built at downscale 2, mild filtering.
#   metric   true only when the reconstruction is AprilTag/marker scaled
#   scale_*  provenance from the export's scale_report.json: how many enabled
#            scale bars set the scale and how well they agree. Small spread means
#            the metric claim is supported; a large spread means the survey's
#            geometry disagrees with itself and `metric` deserves scepticism.
#   segments count of continuous runs. Breaks are consecutive-frame steps beyond
#            10x the median (~26 cm in 67 ms, i.e. ~4 m/s -- not a diver), so
#            they are reconstruction discontinuities and windows must not span them.
#
# REBUILT 2026-10-26, from scratch, after the rectified-intrinsics bug (see
# CLAUDE.md). Every project was re-aligned in the GUI at f=1304.3611 with all 11
# intrinsic parameters locked, then markers enabled and scale bars checked and
# `updateTransform()` applied. Everything downstream -- depth maps, EXR exports,
# COLMAP poses, indices, WAI trees, covisibility -- was regenerated.
#
# What changed, and why the numbers below look different from any earlier copy:
#   depth is ~1.28-1.33x deeper, matching the 1.3162 focal ratio exactly. Median
#   altitudes moved from 0.95-1.24 m to 1.25-1.63 m, which is where a survey flown
#   at 1-2 m hover belongs.
#   scale residuals improved on every survey but joels. soundtrap went from -2.32%
#   (its tags scattering 19%) to -0.02%, so it is no longer the weak metric claim.
#   EVERY survey is now ONE continuous segment. The old 2-7 breaks per survey were
#   artifacts of the bad alignment, not gaps in the data: max consecutive-frame step
#   is 1.4-8.1x the median against a BREAK_FACTOR of 10. Anything selecting frames
#   by SEGMENT INDEX (configs/splits/holdout_boobyrock_soundtrap.yaml) is therefore
#   broken and must be reworked to select by frame range.
#   ZED stereo now agrees to 0.979-0.992 (was 1.287), flat across range.
#
# Note the exports are now SIMPLE_PINHOLE, not PINHOLE: the rectified sensor has
# b1 exactly 0, so fx == fy and Metashape drops the second focal.

dives:
  - label: divercam_tektite_lawnmower
    root: /srv/warplab/home/dxy/divercam_dataset/2026-05-19/diver_zedxm_2026-05-19-14-52-33/down
    export: tektite-lawnmower-lost-2026-05-19-14-52-33-downleft_colmap
    depth: tektite-lawnmower-lost-2026-05-19-14-52-33-downleft_depth
    metric: true
    site: tektite
    pattern: lawnmower
    frames: 27135
    segments: 1
    scale_bars: 20
    scale_error_median_percent: 0.18
    note: the largest survey. 5 tags (01-04, 10) all at 150 mm, now agreeing to
      +0.18% where the pre-redo alignment gave 0.65%. Median dense depth 1.539 m.

  - label: divercam_yawzi_lawnmower
    root: /srv/warplab/home/dxy/divercam_dataset/2026-05-19/diver_zedxm_2026-05-19-19-57-58/down
    export: yawzi-lawnmower-diver_zedxm_2026-05-19-19-57-58-down-left_colmap
    depth: yawzi-lawnmower-diver_zedxm_2026-05-19-19-57-58-down-left_depth
    metric: true
    site: yawzi
    pattern: lawnmower
    frames: 21087
    segments: 1
    scale_bars: 16
    scale_error_median_percent: -0.02
    note: 4 tags (05-08) at 150 mm, -0.02% -- tied with soundtrap for the best
      scaled survey. Median dense depth 1.624 m.

  - label: divercam_boobyrock_lawnmower
    root: /srv/warplab/home/dxy/divercam_dataset/2026-05-20/diver_zedxm_2026-05-20-15-54-56/down
    export: boobyrock-lawnmower-2026-05-20-15-54-56-downleft_colmap
    depth: boobyrock-lawnmower-2026-05-20-15-54-56-downleft_depth
    metric: true
    site: boobyrock
    pattern: lawnmower
    frames: 12578
    segments: 1
    scale_bars: 4
    scale_error_median_percent: -0.13
    note: a single tag (13, 150 mm) sets the scale, so its -0.13% residual means
      self-consistent rather than cross-validated -- nothing disagrees because
      there is nothing to disagree with. Still the lowest altitude of the set,
      median dense depth 1.249 m.

  - label: divercam_joels_lawnmower
    root: /srv/warplab/home/dxy/divercam_dataset/2026-05-20/diver_zedxm_2026-05-20-19-51-25/down
    export: joels-lawnmower-2026-05-20-19-51-25-downleft_colmap
    depth: joels-lawnmower-2026-05-20-19-51-25-downleft_depth
    metric: true
    site: joels
    pattern: lawnmower
    frames: 16462
    segments: 1
    scale_bars: 12
    scale_error_median_percent: -0.52
    note: mixed tag sizes by design -- tags 01 and 03 are 155 mm, tag 13 is 150 mm.
      The only survey whose residual got WORSE in the redo (-0.01% -> -0.52%), which
      is expected -- the old figure was fit against a focal that was wrong, so it was
      never a measure of accuracy. -0.52% over 12 bars of two different sizes is the
      weakest cross-validated claim of the set. Median dense depth 1.397 m.

  - label: divercam_yawzi_soundtrap
    root: /srv/warplab/home/dxy/divercam_dataset/2026-05-21/diver_zedxm_2026-05-21-16-46-58/down
    export: yawzi-soundtrap-lawnmower-2026-05-21-16-46-58-downleft_colmap
    depth: yawzi-soundtrap-lawnmower-2026-05-21-16-46-58-downleft_depth
    metric: true
    site: yawzi
    pattern: lawnmower
    frames: 16042
    segments: 1
    scale_bars: 16
    scale_error_median_percent: -0.02
    note: was the WEAKEST metric claim at -2.32% with its tags scattering 19%; the
      re-align brought it to -0.02% on the same 16 bars. That scatter was the bad
      focal distorting the geometry, not the tags. Uses the same physical tags 05-08
      as the yawzi lawnmower dive. Median dense depth 1.410 m.

  - label: divercam_yawzi_backforth_tag
    root: /srv/warplab/home/dxy/divercam_dataset/2026-05-21/diver_zedxm_2026-05-21-17-08-33/down
    export: yawzi-backandforthtag-2026-05-21-17-08-33-down-left_colmap
    depth: yawzi-backandforthtag-2026-05-21-17-08-33-down-left_depth
    metric: true
    site: yawzi
    pattern: back-and-forth with AprilTag
    frames: 1545
    segments: 1
    scale_bars: 8
    scale_error_median_percent: -0.12
    note: two tags (5, 6) at 150 mm, -0.12%. Not a grid survey but a short
      back-and-forth, so useful for revisit behaviour rather than area coverage.
      A forward/ directory now exists for this dive (1546 frames, one more than
      the 1545 downward -- the forward camera starts a frame early), so it can
      carry mixed down/forward windows. Median dense depth 1.627 m.

  # The first non-metric dive in the tree. It has no markers, so
  # chunk.transform.scale is None, and depth_scale_to_metres is a MULTIPLIER in
  # divercam.py:434 and divercam_covisibility.py:103 -- without a number it cannot
  # enter the tree at all, not even for scale-invariant use, because the
  # covisibility radius thresholds are in metres. The scale below was fitted from
  # the EKF by scripts/divercam_fit_scale.py and `metric` stays FALSE: the number
  # exists so the geometry bookkeeping works, not so the dive can supervise scale.
  - label: divercam_yawzi_backforth_dendrogyra
    root: /srv/warplab/home/dxy/divercam_dataset/2026-05-21/diver_zedxm_2026-05-21-17-05-03/down
    export: yawzi-backandforth-2026-05-21-17-05-03-down-left_colmap
    depth: yawzi-backandforth-2026-05-21-17-05-03-down-left_depth
    metric: false
    site: yawzi
    pattern: back-and-forth, no markers
    frames: 2775
    segments: 1
    scale_bars: 0
    scale_error_median_percent: null
    note: re-aligned 2026-10-26, 2775/2775 cameras at the rectified focal, no markers
      and no scale bars. Scale 0.09570636 m per chunk unit, fitted against the EKF's
      inter-frame translations (DVL velocity x dt, metric to ~0.5% with no accumulated
      drift -- the absolute EKF XY drifts and is NOT used). Per-step spread is +/-10.6%,
      but two independent checks land it -- the implied median step is 0.0259 m against
      0.026 m on the scaled surveys, and the implied median dense depth is 1.473 m,
      inside the 1.25-1.63 m band of the five -- and nothing in the fit used depth.
      Held out as the TEST revisit sequence. It is not a site-generalisation probe,
      since site yawzi is in train; it is there because the GT-free revisit metrics
      need a back-and-forth dive outside training and backforth_tag is in train.
      Covisibility is sparse for a survey of its size (median 2 neighbours, 2174 of
      5549 frames isolated), so prefer temporal windows over covisibility sets here.
